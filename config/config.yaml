system:
  language: mn

storage:
  root: '.'
  project_root: '.'
  model_root: 'models'
  recordings: 'recordings'
  huggingface_home: 'huggingface'
  huggingface_cache: 'huggingface/hub'

stt:
  # Models are selected by the requested desktop/API language. Only one is
  # resident at a time so the application fits comfortably on a 4 GB GPU.
  mongolian_model: 'orgilj/moonshine-mn'
  mongolian_local_path: 'models/stt/moonshine-mn'
  english_model: 'Qwen/Qwen3-ASR-0.6B-hf'
  english_local_path: 'models/stt/qwen3-asr-0.6b'
  device: cuda
  fallback_device: cpu
  sample_rate: 16000
  max_new_tokens: 256

tts:
  # Use "local" for the downloaded VITS model or "edge" for the free
  # Microsoft Edge Mongolian voice. The API returns the selected format.
  provider: edge
  model: 'Bokhbat/mongolian-vits-tts'
  local_path: 'models/tts/mongolian-vits-tts'
  device: cpu
  speaker_id: null
  edge_voice: 'mn-MN-YesuiNeural'
  edge_rate: '+0%'
  edge_volume: '+0%'
  edge_pitch: '+0Hz'
  english_model: 'hexgrad/Kokoro-82M'
  english_voice: 'af_heart'
  english_device: 'cuda'

llm:
  provider: nvidia_nim
  base_url: 'https://integrate.api.nvidia.com/v1'
  model: null
  api_key_env: NVIDIA_API_KEY
  timeout_seconds: 60
  max_tokens: 128
  temperature: 0.2
  system_prompt: 'You are a helpful bilingual voice assistant. Answer in the same language as the user. Keep spoken answers concise.'

audio:
  input_device: null
  output_device: null
  sample_rate: 16000
  blocksize: 512
  max_seconds: 15
  push_to_talk_hotkey: space


desktop:
  hotkey: 'ctrl+alt'
  language: mn

vad:
  enabled: true
  start_threshold: 0.015
  stop_threshold: 0.008
  silence_seconds: 0.8
  min_speech_seconds: 0.25
api:
  host: '127.0.0.1'
  port: 8000
  max_upload_bytes: 26214400
logging:
  enabled: true
  save_recordings: false
